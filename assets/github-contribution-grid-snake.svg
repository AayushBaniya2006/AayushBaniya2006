<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Contribution snake placeholder">
  <rect width="900" height="180" fill="#f6f8fa"/>
  <rect x="18" y="18" width="864" height="144" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M60 110 C170 40, 280 140, 390 70 S610 130, 730 65 S820 90, 840 80" fill="none" stroke="#1f6feb" stroke-width="6" stroke-linecap="round"/>
  <circle r="7" fill="#2da44e">
    <animateMotion dur="7s" repeatCount="indefinite" path="M60 110 C170 40, 280 140, 390 70 S610 130, 730 65 S820 90, 840 80"/>
  </circle>
  <text x="450" y="62" text-anchor="middle" fill="#24292f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    Contribution snake is initializing
  </text>
  <text x="450" y="90" text-anchor="middle" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="14">
    It will auto-update after the GitHub Action runs once.
