<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Animated systems banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#b873ff;#58a6ff" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#b873ff">
        <animate attributeName="stop-color" values="#b873ff;#58a6ff;#b873ff" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" />
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="218" rx="14" fill="none" stroke="#30363d" />

  <path d="M90 160 C210 70, 330 180, 450 92 S690 172, 840 86 S1035 155, 1110 90" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" />
  <path d="M90 160 C210 70, 330 180, 450 92 S690 172, 840 86 S1035 155, 1110 90" fill="none" stroke="url(#flow)" stroke-width="10" stroke-linecap="round" opacity="0.25" filter="url(#soft)" />

  <g>
    <circle r="6" fill="#58a6ff">
      <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M90 160 C210 70, 330 180, 450 92 S690 172, 840 86 S1035 155, 1110 90" />
    </circle>
    <circle r="6" fill="#b873ff">
      <animateMotion begin="2.2s" dur="7s" repeatCount="indefinite" rotate="auto" path="M90 160 C210 70, 330 180, 450 92 S690 172, 840 86 S1035 155, 1110 90" />
    </circle>
    <circle r="6" fill="#7ee787">
      <animateMotion begin="4.4s" dur="7s" repeatCount="indefinite" rotate="auto" path="M90 160 C210 70, 330 180, 450 92 S690 172, 840 86 S1035 155, 1110 90" />
    </circle>
  </g>

  <text x="600" y="64" text-anchor="middle" fill="#e6edf3" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700">
    Building systems that reason under pressure
  </text>
  <text x="600" y="96" text-anchor="middle" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="16">
    AI + Infra + Security, shipped as measurable products
  </text>
</svg>
