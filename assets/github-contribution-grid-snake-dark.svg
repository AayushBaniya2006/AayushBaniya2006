  <rect x="18" y="18" width="864" height="144" rx="12" fill="#161b22" stroke="#30363d"/>
  <path d="M60 110 C170 40, 280 140, 390 70 S610 130, 730 65 S820 90, 840 80" fill="none" stroke="#58a6ff" stroke-width="6" stroke-linecap="round"/>
